name: Control API conformance

# Builds x16emu (R49 Makefile build) and asserts it implements the
# retro-remote-debug-controller HTTP contract (the conformance suite ships in
# the submodule). Runs headless via SDL's dummy video driver — no display.

on:
  push:
    branches: [ master, main ]
  pull_request:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    # --- CI RUNNER: swap the two lines below to go back to GitHub-hosted ---
    # runs-on: ubuntu-latest
    runs-on: [self-hosted]   # TEMP: GH Actions minutes out — org self-hosted runners (restore the line above to revert)
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The self-hosted runners have Docker and no sudo: the build and the
      # suite run in a stock Debian with SDL2 and pytest, and what they write
      # is handed back to the user that owns the checkout.
      - name: Build x16emu
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e OWNER="$(id -u):$(id -g)" debian:bookworm-slim sh -c '
            apt-get update -q && apt-get install -y -q --no-install-recommends build-essential make libsdl2-dev zlib1g-dev >/dev/null &&
            make -j3; status=$?; chown -R "$OWNER" /src; exit $status'

      - name: Generate a dummy ROM
        # Conformance exercises the control API, not ROM behaviour, so a
        # zero-filled ROM of the right size is enough to run the machine.
        run: truncate -s 262144 rom.bin

      - name: Run conformance suite
        run: |
          docker run --rm -v "$PWD:/src" -w /src/src/extern/retro-remote-debug-controller/conformance -e OWNER="$(id -u):$(id -g)" \
            -e RRDC_PORT=8080 -e RRDC_BOOT_TIMEOUT=30 \
            -e RRDC_EMU_CMD="SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy /src/x16emu -rom /src/rom.bin -warp -controlport {port}" \
            debian:bookworm-slim sh -c '
              apt-get update -q && apt-get install -y -q --no-install-recommends libsdl2-2.0-0 python3 python3-pytest >/dev/null &&
              python3 -m pytest -v -p no:cacheprovider; status=$?; chown -R "$OWNER" /src; exit $status' 
